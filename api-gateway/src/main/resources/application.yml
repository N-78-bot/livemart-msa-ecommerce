server:
  port: ${PORT:8888}

spring:
  application:
    name: api-gateway
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      # API Gateway는 자체 ApiKeyFilter로 인증 처리 → Spring Security 비활성화
      - org.springframework.boot.autoconfigure.security.reactive.ReactiveSecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.reactive.ReactiveUserDetailsServiceAutoConfiguration
  flyway:
    enabled: false
  # Redis (Rate Limiting 전용)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      # X-Forwarded 헤더 전달 - user-service가 {baseUrl}을 api-gateway URL로 인식
      forwarded:
        enabled: true
      x-forwarded:
        enabled: true
        for-enabled: true
        host-enabled: true
        port-enabled: true
        proto-enabled: true
        prefix-enabled: true

      # 전역 기본 필터
      # CircuitBreaker는 default-filters에서 제거 — 단일 CB가 모든 서비스를 차단하는 문제 방지
      # RequestRateLimiter는 로컬 개발 환경에서 KeyResolver 충돌로 403 유발 — 제거

      routes:
        # User Service - API
        # Render/직접URL: USER_SERVICE_URL=https://xxx.onrender.com 설정 시 Eureka 불필요
        - id: user-service
          uri: ${USER_SERVICE_URL:lb://user-service}
          predicates:
            - Path=/api/users/**
          filters:
            - RewritePath=/api/users/(?<segment>.*), /api/users/${segment}

        # User Service - OAuth2 소셜 로그인
        - id: user-service-oauth2
          uri: ${USER_SERVICE_URL:lb://user-service}
          predicates:
            - Path=/oauth2/**,/login/oauth2/**
          filters:
            - RewritePath=/(?<segment>.*), /${segment}

        # User Service - MFA API
        - id: user-service-mfa
          uri: ${USER_SERVICE_URL:lb://user-service}
          predicates:
            - Path=/api/v1/mfa/**
          filters:
            - RewritePath=/api/v1/mfa(?<segment>.*), /api/v1/mfa${segment}

        # User Service - 인증 API (이메일 인증 등)
        - id: user-service-auth
          uri: ${USER_SERVICE_URL:lb://user-service}
          predicates:
            - Path=/api/auth/**
          filters:
            - RewritePath=/api/auth/(?<segment>.*), /api/auth/${segment}

        # Product Service
        - id: product-service
          uri: ${PRODUCT_SERVICE_URL:lb://product-service}
          predicates:
            - Path=/api/products/**,/api/categories/**
          filters:
            - RewritePath=/api/(?<segment>.*), /api/${segment}

        # Order Service - 주문 생성/조회
        - id: order-service
          uri: ${ORDER_SERVICE_URL:lb://order-service}
          predicates:
            - Path=/api/orders/**
          filters:
            - RewritePath=/api/orders/(?<segment>.*), /api/orders/${segment}

        # Coupon & Return Service (Order Service)
        - id: coupon-service
          uri: ${ORDER_SERVICE_URL:lb://order-service}
          predicates:
            - Path=/api/coupons/**
          filters:
            - RewritePath=/api/coupons/(?<segment>.*), /api/coupons/${segment}

        - id: return-service
          uri: ${ORDER_SERVICE_URL:lb://order-service}
          predicates:
            - Path=/api/returns/**
          filters:
            - RewritePath=/api/returns/(?<segment>.*), /api/returns/${segment}

        # Delivery Service (Order Service)
        - id: delivery-service
          uri: ${ORDER_SERVICE_URL:lb://order-service}
          predicates:
            - Path=/api/delivery/**
          filters:
            - RewritePath=/api/delivery/(?<segment>.*), /api/delivery/${segment}

        # Payment Service - 결제
        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:lb://payment-service}
          predicates:
            - Path=/api/payments/**
          filters:
            - RewritePath=/api/payments(?<segment>.*), /api/v1/payments${segment}

        # Inventory Service
        - id: inventory-service
          uri: ${INVENTORY_SERVICE_URL:lb://inventory-service}
          predicates:
            - Path=/api/inventory/**
          filters:
            - RewritePath=/api/inventory/(?<segment>.*), /api/v1/inventory/${segment}

        # Notification Service
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:lb://notification-service}
          predicates:
            - Path=/api/notifications/**
          filters:
            - RewritePath=/api/notifications/(?<segment>.*), /api/notifications/${segment}

        # Analytics Service
        - id: analytics-service
          uri: ${ANALYTICS_SERVICE_URL:lb://analytics-service}
          predicates:
            - Path=/api/analytics/**
          filters:
            - RewritePath=/api/analytics/(?<segment>.*), /api/v1/analytics/${segment}

        # Analytics Dashboard Service (realtime)
        - id: analytics-dashboard-service
          uri: ${ANALYTICS_SERVICE_URL:lb://analytics-service}
          predicates:
            - Path=/api/dashboard/**
          filters:
            - RewritePath=/api/dashboard/(?<segment>.*), /api/v1/dashboard/${segment}

        # Seller Dashboard (Product Service)
        - id: seller-dashboard
          uri: ${PRODUCT_SERVICE_URL:lb://product-service}
          predicates:
            - Path=/api/sellers/**
          filters:
            - RewritePath=/api/sellers/(?<segment>.*), /api/sellers/${segment}

        # AI Service - 추천/설명생성/챗봇
        - id: ai-service
          uri: ${AI_SERVICE_URL:lb://ai-service}
          predicates:
            - Path=/api/ai/**
          filters:
            - RewritePath=/api/ai/(?<segment>.*), /api/ai/${segment}

        # Circuit Breaker fallback - 서킷 오픈 시 응답
        - id: fallback-route
          uri: no://op
          predicates:
            - Path=/fallback
          filters:
            - SetStatus=503

      # CORS 설정 - 프로덕션에서는 환경변수로 관리
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost"
              - "http://localhost:3000"
              - "http://localhost:3001"
              - "http://localhost:3002"
              - "https://livemart-parkmin-jes-projects.vercel.app"
              - ${CORS_ALLOWED_ORIGINS:http://localhost}
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
              - X-API-Key
              - X-Requested-With
              - Cookie
            exposedHeaders:
              - Set-Cookie
            allowCredentials: true
            maxAge: 3600

# Actuator + Prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus  # gateway 라우팅 정보 노출 제거
  endpoint:
    health:
      show-details: when-authorized  # 인가된 사용자만 상세 정보 노출
    gateway:
      enabled: false  # gateway 라우팅 정보 비활성화 (보안)
  health:
    redis:
      # Redis는 Rate Limiter에 사용됨 → 헬스체크 활성화
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  # Distributed Tracing (Zipkin HTTP format — micrometer-tracing-bridge-brave 사용)
  # management.otlp.tracing → Zipkin HTTP endpoint 불일치 버그 수정:
  # OTLP exporter는 /v1/traces 경로(protobuf)를 사용하며 Zipkin의 /api/v2/spans와 호환되지 않음
  tracing:
    sampling:
      probability: 0.1
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://zipkin:9411/api/v2/spans}

# ── Resilience4j Circuit Breaker 상세 설정 ────────────────────
# automaticTransitionFromOpenToHalfOpenEnabled: true 로 서비스 재시작 후 자동 복구
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 60
        waitDurationInOpenState: 15s            # 15초 대기 후 Half-Open 전환
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true  # 핵심: 자동 복구
        registerHealthIndicator: true
    instances:
      default:
        baseConfig: default
  timelimiter:
    configs:
      default:
        timeoutDuration: 15s
    instances:
      default:
        baseConfig: default

# JWT 서명 검증 (user-service와 동일한 시크릿 사용)
jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.cloud.gateway.filter.ratelimit: DEBUG
    io.github.resilience4j.circuitbreaker: DEBUG     # CB 상태 변화 로그

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# 로컬 개발: 호스트명 해결 타임아웃 단축 (Cannot determine local hostname WARN 방지)
spring.cloud.inetutils.timeout-seconds: 1
logging.level.com.netflix.discovery: ERROR
logging.level.com.netflix.eureka: ERROR

---
# ── Railway 클라우드 프로파일 ─────────────────────────────────
spring:
  config:
    activate:
      on-profile: "railway"
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka-server.railway.internal:8761/eureka/}
    # Railway 내부 네트워크 DNS 해결 대기 (서비스 시작 순서 차이)
    initial-instance-info-replication-interval-seconds: 10
    registry-fetch-interval-seconds: 10
  instance:
    prefer-ip-address: true
    hostname: ${RAILWAY_PRIVATE_DOMAIN:api-gateway.railway.internal}

# Railway CORS: Vercel 도메인 추가
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins:
  - "http://localhost:3000"
  - "https://livemart-parkmin-jes-projects.vercel.app"
  - ${CORS_ALLOWED_ORIGINS:https://livemart-parkmin-jes-projects.vercel.app}

logging:
  level:
    org.springframework.cloud.gateway: WARN
    com.netflix.discovery: ERROR
    com.netflix.eureka: ERROR

---
# ── Render 무료 클라우드 프로파일 ─────────────────────────────
# Eureka 없이 직접 URL 라우팅 사용 (Render는 내부 네트워크 없음)
# 각 서비스 URL은 Render 대시보드에서 환경변수로 설정
spring:
  config:
    activate:
      on-profile: "render"
  data:
    redis:
      url: ${REDIS_URL}  # Upstash Redis URL (rediss://...)

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

logging:
  level:
    org.springframework.cloud.gateway: WARN
    com.netflix.discovery: ERROR
    com.netflix.eureka: ERROR
