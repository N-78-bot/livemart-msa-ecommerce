services:
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8888:8888"
    environment:
      - USER_SERVICE_URL=http://user-service:8085
      - PRODUCT_SERVICE_URL=http://product-service:8086
      - ORDER_SERVICE_URL=http://order-service:8087
      - INVENTORY_SERVICE_URL=http://inventory-service:8088
      - PAYMENT_SERVICE_URL=http://payment-service:8089
      - NOTIFICATION_SERVICE_URL=http://notification-service:8086
      - ANALYTICS_SERVICE_URL=http://analytics-service:8087
      - AI_SERVICE_URL=http://ai-service:8090
      - REDIS_URL=${REDIS_URL}
      - SPRING_DATA_REDIS_URL=${REDIS_URL}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - JWT_SECRET=${JWT_SECRET}
      - SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING=true
      - SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED=false
    depends_on:
      - user-service
      - product-service
      - order-service
      - payment-service
      - inventory-service
      - notification-service
      - analytics-service
      - ai-service
      - kafka
    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    expose:
      - "8085"
    environment:
      - PORT=8085
      - DATABASE_URL=${DATABASE_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_URL=${REDIS_URL}
      - SPRING_DATA_REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}
      - KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET}
      - NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
      - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - OAUTH2_REDIRECT_URI=${OAUTH2_REDIRECT_URI}
      - OAUTH2_BASE_URL=${OAUTH2_BASE_URL}
      - SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING=true
      - SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED=false
      - SPRING_FLYWAY_ENABLED=false
      - CORS_ALLOWED_ORIGINS=https://livemart-parkmin-jes-projects.vercel.app
    restart: unless-stopped

  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    expose:
      - "8086"
    environment:
      - PORT=8086
      - DATABASE_URL=${DATABASE_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_URL=${REDIS_URL}
      - SPRING_DATA_REDIS_URL=${REDIS_URL}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING=true
      - SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED=false
      - SPRING_FLYWAY_ENABLED=false
      - SPRING_AUTOCONFIGURE_EXCLUDE=org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration,org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchRepositoriesAutoConfiguration
    restart: unless-stopped

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    expose:
      - "8087"
    environment:
      - PORT=8087
      - DATABASE_URL=${DATABASE_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_URL=${REDIS_URL}
      - SPRING_DATA_REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - PRODUCT_SERVICE_URL=http://product-service:8086
      - PAYMENT_SERVICE_URL=http://payment-service:8089
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING=true
      - SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED=false
      - SPRING_FLYWAY_ENABLED=false
    restart: unless-stopped

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    expose:
      - "8088"
    environment:
      - PORT=8088
      - DATABASE_URL=${DATABASE_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_URL=${REDIS_URL}
      - SPRING_DATA_REDIS_URL=${REDIS_URL}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING=true
      - SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED=false
      - SPRING_FLYWAY_ENABLED=false
      - SPRING_AUTOCONFIGURE_EXCLUDE=org.redisson.spring.starter.RedissonAutoConfigurationV2
    restart: unless-stopped

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    expose:
      - "8089"
    environment:
      - PORT=8089
      - DATABASE_URL=${DATABASE_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - TOSS_CLIENT_KEY=${TOSS_CLIENT_KEY}
      - TOSS_SECRET_KEY=${TOSS_SECRET_KEY}
      - ORDER_SERVICE_URL=http://order-service:8087
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING=true
      - SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED=false
      - SPRING_FLYWAY_ENABLED=false
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    expose:
      - "8086"
    environment:
      - PORT=8086
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - REDIS_URL=${REDIS_URL}
      - SPRING_DATA_REDIS_URL=${REDIS_URL}
      - MAIL_USERNAME=${SMTP_USERNAME}
      - MAIL_PASSWORD=${SMTP_PASSWORD}
      - SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING=true
      - SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED=false
    restart: unless-stopped

  analytics-service:
    build:
      context: .
      dockerfile: analytics-service/Dockerfile
    expose:
      - "8087"
    environment:
      - PORT=8087
      - DATABASE_URL=${DATABASE_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_URL=${REDIS_URL}
      - SPRING_DATA_REDIS_URL=${REDIS_URL}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING=true
      - SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED=false
      - SPRING_FLYWAY_ENABLED=false
      - SPRING_AUTOCONFIGURE_EXCLUDE=org.springdoc.core.configuration.SpringDocConfiguration,org.springdoc.webmvc.core.configuration.SpringDocWebMvcConfiguration
    restart: unless-stopped

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    expose:
      - "8090"
    environment:
      - PORT=8090
      - REDIS_URL=${REDIS_URL}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - SPRING_AI_OPENAI_API_KEY=${OPENROUTER_API_KEY}
      - SPRING_AI_OPENAI_BASE_URL=https://openrouter.ai/api/v1
      - SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL=google/gemma-3-27b-it:free
      - SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING=true
      - SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED=false
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.7.0
    expose:
      - "9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_CLUSTER_ID=livemart-kafka-cluster
    restart: unless-stopped
